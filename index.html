    <script>
       const ENABLE_PRELOADER = false; 

        document.addEventListener('DOMContentLoaded', () => {
            const preloader = document.getElementById('main-preloader');
            const mainContent = document.getElementById('main-content');

            if (!ENABLE_PRELOADER) {
                // Если прелоадер выключен:
                if (preloader) {
                    preloader.style.display = 'none'; // Скрываем его, чтобы не мешал
                    // или preloader.remove(); чтобы полностью удалить из DOM
                }
                if (mainContent) {
                    mainContent.classList.add('is-visible'); // Сразу показываем контент
                }
                return; // Прерываем выполнение, чтобы не вешать лишние слушатели
            }

            // Если прелоадер включен (стандартная логика)
            if (preloader && mainContent) {
                preloader.addEventListener('preloader-complete', () => {
                    mainContent.classList.add('is-visible');
                });
            }
        });
    </script>

    <script>
        
        function trackEvent(name, params) {
            if (typeof window.gtag === 'function') {
                window.gtag('event', name, params || {});
            }
        }

        
        document.addEventListener('DOMContentLoaded', () => {
            const sections = document.querySelectorAll('.landing-section');
            const seenSections = new Set();

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !seenSections.has(entry.target.id)) {
                        seenSections.add(entry.target.id);
                        trackEvent('section_view', { section: entry.target.id });
                        
                        
                        if (entry.target.id === 'contact') {
                            trackEvent('form_view');
                        }
                    }
                });
            }, { threshold: 0.25 }); 

            sections.forEach(section => {
                if (section.id) observer.observe(section);
            });
        });
    </script>
